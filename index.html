<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>视频检索</title>
    <style>
        :root {
            --bg: #f4f6f8;
            --card: #fff;
            --text: #1f2937;
            --muted: #6b7280;
            --accent: #2563eb;
            --border: #e5e7eb;
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
            background: var(--bg);
            color: var(--text);
        }

        header {
            max-width: 1100px;
            margin: 0 auto;
            padding: 32px 20px 16px;
        }

        h1 {
            margin: 0 0 16px;
            font-size: 28px;
        }

        .search-box {
            width: 100%;
            max-width: 480px;
            padding: 12px 14px;
            border: 1px solid var(--border);
            border-radius: 10px;
            font-size: 16px;
            outline: none;
        }

        .search-box:focus {
            border-color: var(--accent);
            box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.15);
        }

        #status {
            max-width: 1100px;
            margin: 8px auto 0;
            padding: 0 20px;
            color: #b45309;
            font-size: 14px;
        }

        main {
            max-width: 1100px;
            margin: 0 auto;
            padding: 20px;
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
            gap: 18px;
        }

        .card {
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: 12px;
            overflow: hidden;
            text-decoration: none;
            color: inherit;
            display: flex;
            flex-direction: column;
            transition: transform 0.15s ease, box-shadow 0.15s ease;
        }

        .card:hover {
            transform: translateY(-3px);
            box-shadow: 0 8px 20px rgba(15, 23, 42, 0.08);
        }

        .card img {
            width: 100%;
            height: 150px;
            object-fit: cover;
            background: #dbe3ee;
        }

        .card-body {
            padding: 12px 14px 16px;
        }

        .card-title {
            margin: 0 0 8px;
            font-size: 16px;
            line-height: 1.4;
        }

        .tags {
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
        }

        .tag {
            font-size: 12px;
            color: var(--accent);
            background: #eff6ff;
            padding: 2px 8px;
            border-radius: 999px;
        }

        .empty {
            grid-column: 1 / -1;
            text-align: center;
            color: var(--muted);
            padding: 40px 0;
        }
    </style>
</head>
<body>
    <header>
        <h1>视频检索</h1>
        <input class="search-box" id="search" type="search" placeholder="按标题或标签检索...">
    </header>
    <p id="status"></p>
    <main id="list"></main>

    <script>
        const 列表节点 = document.getElementById("list");
        const 搜索框 = document.getElementById("search");
        const 状态节点 = document.getElementById("status");
        let 全部视频 = [];

        function 过滤视频(列表, 关键字) {
            const k = 关键字.trim().toLowerCase();
            if (!k) {
                return 列表;
            }
            return 列表.filter((v) => {
                const 标题 = (v.title || "").toLowerCase();
                const 标签 = (v.tags || []).join(" ").toLowerCase();
                return 标题.includes(k) || 标签.includes(k);
            });
        }

        function 渲染(列表) {
            列表节点.innerHTML = "";
            if (!列表.length) {
                列表节点.innerHTML = '<p class="empty">没有匹配的视频</p>';
                return;
            }

            列表.forEach((v) => {
                const 卡片 = document.createElement("a");
                卡片.className = "card";
                卡片.href = v.url || "#";
                卡片.target = "_blank";
                卡片.rel = "noopener noreferrer";

                const 封面 = document.createElement("img");
                封面.src = v.cover || "";
                封面.alt = v.title || "封面";
                // 不发送本站来源，避免 B 站等图床因防盗链拒绝加载
                封面.referrerPolicy = "no-referrer";
                封面.onerror = () => {
                    封面.alt = "封面加载失败，请检查 cover 路径";
                };

                const 内容 = document.createElement("div");
                内容.className = "card-body";

                const 标题 = document.createElement("h2");
                标题.className = "card-title";
                标题.textContent = v.title || "未命名";

                const 标签区 = document.createElement("div");
                标签区.className = "tags";
                (v.tags || []).forEach((t) => {
                    const span = document.createElement("span");
                    span.className = "tag";
                    span.textContent = t;
                    标签区.appendChild(span);
                });

                内容.appendChild(标题);
                内容.appendChild(标签区);
                卡片.appendChild(封面);
                卡片.appendChild(内容);
                列表节点.appendChild(卡片);
            });
        }

        function 应用检索() {
            渲染(过滤视频(全部视频, 搜索框.value));
        }

        async function 加载数据() {
            try {
                const 响应 = await fetch("videos.json");
                if (!响应.ok) {
                    throw new Error("无法读取 videos.json");
                }
                全部视频 = await 响应.json();
                应用检索();
            } catch (err) {
                状态节点.textContent =
                    "读取 videos.json 失败。请在本目录运行：python -m http.server 8080 ，然后打开 http://127.0.0.1:8080/";
                全部视频 = [];
                应用检索();
            }
        }

        搜索框.addEventListener("input", 应用检索);
        加载数据();
    </script>
</body>
</html>
